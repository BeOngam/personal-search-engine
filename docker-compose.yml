services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: pse-qdrant
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dockerfile
    image: personal-search-engine:local
    container_name: pse-api
    command: ["python", "main.py", "serve"]
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - type: bind
        source: ${DOCS_PATH:-./sample-data}
        target: /data/docs
        read_only: true
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      DOCS_PATH: /data/docs
      LLM_HOST: http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ui:
    image: personal-search-engine:local
    container_name: pse-ui
    command: ["python", "main.py", "ui", "--port", "8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_HOST: api
    restart: unless-stopped

  scheduler:
    image: personal-search-engine:local
    container_name: pse-scheduler
    command: ["python", "main.py", "scheduler"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - type: bind
        source: ${DOCS_PATH:-./sample-data}
        target: /data/docs
        read_only: true
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      DOCS_PATH: /data/docs
    restart: unless-stopped

volumes:
  qdrant_data:
